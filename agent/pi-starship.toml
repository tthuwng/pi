# Compact Pi footer: model and fast/normal mode appear first, followed by the
# active subscription/account, session name, and Codex weekly quota.
format = "$model$extension_status"

[model]
format = "[$model]($style) "
style = "bold blue"

[extension_status]
format = "[$statuses]($style)"
separator = " • "
max_statuses = 1
icons = { "multi-pass" = "", fallback = "" }
